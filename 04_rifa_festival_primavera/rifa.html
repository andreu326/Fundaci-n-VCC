<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rifa · Festival de la Primavera 2026</title>
<style>
  @font-face { font-family: "Krona One"; src: url("assets/fonts/krona-one-latin.woff2") format("woff2"); }
  @font-face { font-family: "Gurajada"; src: url("assets/fonts/gurajada-latin.woff2") format("woff2"); }

  @page { size: 215.9mm 279.4mm; margin: 0; }

  :root {
    --tinta: #2a1d14;
    --linea: rgba(42, 29, 20, .16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 215.9mm; height: 279.4mm; }
  body {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    font-family: "Gurajada", sans-serif;
    color: #fff;
    /* El fondo clásico del festival, a toda la hoja */
    background: #ef6812 url("assets/fondo-clasico.png") center / cover no-repeat;
  }

  .hoja {
    width: 215.9mm; height: 279.4mm;
    padding: 10mm 12mm 9mm;
    display: flex; flex-direction: column;
  }

  /* ---------- Texto encima del fondo ---------- */
  .cabeza {
    display: flex; align-items: center; justify-content: space-between;
    height: 62mm;
  }
  .logo { height: 60mm; margin-left: -3mm; }
  .lado {
    align-self: stretch;
    display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between;
    text-align: right; font-family: "Krona One", sans-serif;
  }
  .jdb { width: 19mm; }
  .rifa { font-size: 42pt; line-height: .9; letter-spacing: .4mm; }
  .rango { font-size: 10.5pt; margin-top: 2.5mm; letter-spacing: .3mm; }
  .monto { font-size: 26pt; line-height: 1; margin-top: 5mm; }
  .por { font-size: 9.5pt; margin-top: 1.5mm; letter-spacing: .3mm; }

  .instrucciones {
    margin-top: 4mm;
    text-align: center; font-size: 14.5pt; line-height: 1.05; text-transform: uppercase;
  }
  .sorteo {
    margin: 2.5mm auto 0;
    display: flex; align-items: flex-end; gap: 2mm;
    font-size: 14.5pt; line-height: 1; text-transform: uppercase;
  }
  .sorteo .raya { width: 70mm; border-bottom: .4mm solid #fff; height: 4mm; }

  /* ---------- Rectángulo blanco con la marca de agua ---------- */
  .tablero {
    position: relative;
    margin-top: 5mm; flex: 1;
    border-radius: 5mm;
    overflow: hidden;
    background: #fff;
    padding: 4mm;
  }
  .tablero::before {
    content: "";
    position: absolute; inset: 0;
    background: url("assets/fondo-clasico.png") center / cover no-repeat;
    opacity: .2;
  }
  .grilla {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(15, 1fr);
    border-top: .3mm solid var(--linea);
    border-left: .3mm solid var(--linea);
  }
  .n {
    display: flex; align-items: center; justify-content: center;
    border-right: .3mm solid var(--linea);
    border-bottom: .3mm solid var(--linea);
    font-family: "Krona One", sans-serif; font-size: 10.5pt; letter-spacing: .2mm;
    color: var(--tinta);
  }

  .pie {
    margin-top: 4mm;
    text-align: center; font-size: 15pt; line-height: 1.05; text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="hoja">

  <header class="cabeza">
    <img class="logo" src="assets/logo-festival-alto.png" alt="Festival de la Primavera 2026">
    <div class="lado">
      <img class="jdb" src="assets/logo-jovenes-del-barrio.svg" alt="Jóvenes del Barrio">
      <div>
        <div class="rifa">RIFA</div>
        <div class="rango">DEL 1 AL 150</div>
        <div class="monto">$1.000</div>
        <div class="por">EL NÚMERO</div>
      </div>
    </div>
  </header>

  <p class="instrucciones">
    Elige uno o más números, deja tu nombre y contacto con quien te vende.<br>
    Una vez pagado, el número queda reservado para ti en el sorteo.
  </p>

  <div class="sorteo">Sorteo <span class="raya"></span></div>

  <section class="tablero">
    <div class="grilla" id="grilla"></div>
  </section>

  <p class="pie">Lo recaudado va en apoyo del Festival de la Primavera</p>

</div>

<script>
  const grilla = document.getElementById("grilla");
  for (let n = 1; n <= 150; n++) {
    const celda = document.createElement("div");
    celda.className = "n";
    celda.textContent = n;
    grilla.appendChild(celda);
  }
</script>
</body>
</html>
